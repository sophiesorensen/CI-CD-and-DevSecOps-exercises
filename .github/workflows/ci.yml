name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Scan NuGet dependencies
        shell: bash
        run: |
          dotnet package list --vulnerable --include-transitive --no-restore --format json --output-version 1 > vulnerability-report.json

          cat vulnerability-report.json

          count=$(jq '[.projects[]? | .frameworks[]? |
            (.topLevelPackages[]?, .transitivePackages[]?) |
            .vulnerabilities[]?] | length' vulnerability-report.json)

          echo "Number of vulnerability findings: $count"

          if [ "$count" -gt 0 ]; then
            echo "Vulnerable dependencies detected!"
            exit 1
          fi

          echo "No known vulnerable dependencies detected."



      - name: Build solution
        run: dotnet build --no-restore

      - name: Run unit tests
        run: dotnet test --no-build

      - name: Scan NuGet dependencies
        run: dotnet package list --vulnerable --include-transitive

